services:
  - type: web
    name: brightpath-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 90 --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: LLM_PROVIDER
        value: mock
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: minimaxai/minimax-m3.1-flash
      - key: NVIDIA_JSON_MODE
        value: "false"
      - key: SIMULATE_FAILURE
        value: "false"
